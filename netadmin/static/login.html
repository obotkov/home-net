<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Домашняя сеть</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#14171c;--muted:#5d6672;--line:#e3e6eb;--soft:#eef1f5;--accent:#2f6fed;--accent-ink:#fff;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--panel:#171b21;--ink:#e7eaee;--muted:#98a2ae;--line:#272d36;--soft:#1e232a;--accent:#5b8dff;--accent-ink:#0b0e12;--bad:#ef6a6a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,100%)}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
button{width:100%;font:inherit;border-radius:9px;padding:10px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.6;cursor:default}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
input:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Домашняя сеть</h1>
  <p>Вход в панель управления</p>
  <button class="p" id="pk" type="button">Войти с passkey</button>
  <div class="hint" id="pkhint" hidden></div>
  <div class="or">или паролем</div>
  <form id="f">
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <div class="err" id="err"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const b64u={enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))};
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'X-Requested-With':'netadmin','Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
const done=()=>location.replace('/');
$('#f').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';const b=e.target.querySelector('button');b.disabled=true;
  try{await post('/auth/login',{password:e.target.password.value});done()}catch(err){$('#err').textContent=err.message}finally{b.disabled=false}};
if(!window.PublicKeyCredential||!window.isSecureContext){$('#pk').disabled=true;$('#pkhint').hidden=false;
  $('#pkhint').textContent='Passkey работает только по HTTPS (домен) или на localhost.'}
$('#pk').onclick=async()=>{$('#err').textContent='';
  try{const o=await post('/auth/passkey/options');
    if(!o.allowCredentials.length)throw new Error('passkey ещё не добавлен: войдите паролем и добавьте его в «Настройках»');
    const cred=await navigator.credentials.get({publicKey:{challenge:b64u.dec(o.challenge),rpId:o.rpId,timeout:o.timeout,userVerification:o.userVerification,
      allowCredentials:o.allowCredentials.map(c=>({type:c.type,id:b64u.dec(c.id)}))}});
    await post('/auth/passkey/login',{id:cred.id,response:{clientDataJSON:b64u.enc(cred.response.clientDataJSON),
      authenticatorData:b64u.enc(cred.response.authenticatorData),signature:b64u.enc(cred.response.signature)}});
    done()}
  catch(err){$('#err').textContent=err.name==='NotAllowedError'?'Отменено или время истекло':err.message}};
</script>
</body>
</html>
